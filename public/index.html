<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3D8B8B" />

    <!-- Yandex.Metrika counter (id 111171857) — analytics + Webvisor/clickmap.
         Placed high in <head> per Metrika guidance; part of the prerendered template
         so it loads on every route. Google Analytics (gtag) to be added once the
         G-XXXX property id is provided. -->
    <script type="text/javascript">
        (function(m,e,t,r,i,k,a){
            m[i]=m[i]||function(){(m[i].a=m[i].a||[]).push(arguments)};
            m[i].l=1*new Date();
            for (var j = 0; j < document.scripts.length; j++) {if (document.scripts[j].src === r) { return; }}
            k=e.createElement(t),a=e.getElementsByTagName(t)[0],k.async=1,k.src=r,a.parentNode.insertBefore(k,a)
        })(window, document,'script','https://mc.yandex.ru/metrika/tag.js?id=111171857', 'ym');

        ym(111171857, 'init', {ssr:true, webvisor:true, clickmap:true, ecommerce:"dataLayer", accurateTrackBounce:true, trackLinks:true});
    </script>
    <noscript><div><img src="https://mc.yandex.ru/watch/111171857" style="position:absolute; left:-9999px;" alt="" /></div></noscript>
    <!-- /Yandex.Metrika counter -->

    <!-- Google tag (gtag.js) — GA4 property G-NZVQHXGY24 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-NZVQHXGY24"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-NZVQHXGY24');
    </script>
    <!-- /Google tag -->

    <!-- Per-page SEO (title, description, canonical, hreflang, robots, Open Graph) is
         injected per route by src/components/SEO.js via react-helmet-async. Static copies
         here were removed because they duplicate/conflict with the per-page tags in the
         prerendered HTML (e.g. canonical -> homepage on every landing page). -->
    <!-- Site icon = the RENEXPRESS app logomark (public/app-icon.png). Only the PNG is
         declared: a competing SVG favicon was winning in Chrome/Firefox (they prefer
         image/svg+xml) and kept showing the old letter-R mark. -->
    <link rel="icon" href="%PUBLIC_URL%/app-icon.png" type="image/png" sizes="512x512" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/app-icon.png" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "RENEXPRESS",
      "alternateName": ["RENCARGO", "Рен Экспресс", "Рен Карго"],
      "url": "https://renexpress.online",
      "logo": "https://renexpress.online/app-icon.png",
      "description": "Надёжная доставка грузов из Турции в Россию. Карго из Стамбула в Москву. Авиа и авто доставка с отслеживанием.",
      "foundingDate": "2017",
      "founder": {
        "@type": "Person",
        "name": "Renat Karaliev"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "ул. Южнопортовая 7а, стр 2, склад 8, ворота 1",
        "addressLocality": "Москва",
        "addressCountry": "RU"
      },
      "telephone": "+905511898288",
      "email": "Inforencargo@gmail.com",
      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+905511898288",
          "contactType": "customer service",
          "areaServed": "TR",
          "availableLanguage": ["Russian", "Turkish", "English"]
        },
        {
          "@type": "ContactPoint",
          "telephone": "+79289707010",
          "contactType": "customer service",
          "areaServed": "RU",
          "availableLanguage": ["Russian"]
        }
      ],
      "sameAs": [
        "https://apps.apple.com/app/renexpress/id6757761284",
        "https://instagram.com/rencargo",
        "https://t.me/RENEXPRESS",
        "https://youtube.com/@Renat_Karaliev",
        "https://www.rencargo.com"
      ],
      "areaServed": ["RU", "TR"],
      "serviceType": ["Cargo delivery", "International shipping", "Freight forwarding"]
    }
    </script>

    <!-- Structured Data: Website with Search -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "RENEXPRESS",
      "url": "https://renexpress.online",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://renexpress.online/shop?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Structured Data: Local Business -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "RENEXPRESS - Склад в Москве",
      "@id": "https://renexpress.online/#moscow",
      "url": "https://renexpress.online",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "ул. Южнопортовая 7а, стр 2, склад 8, ворота 1",
        "addressLocality": "Москва",
        "addressRegion": "Москва",
        "addressCountry": "RU"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 55.7058,
        "longitude": 37.6573
      },
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "09:00",
        "closes": "18:00"
      },
      "priceRange": "$$"
    }
    </script>

    <!-- Structured Data: SoftwareApplication (Mobile App) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "RENEXPRESS",
      "operatingSystem": "iOS",
      "applicationCategory": "BusinessApplication",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "installUrl": "https://apps.apple.com/app/renexpress/id6757761284",
      "description": "Отслеживайте доставки из Турции, создавайте заказы и общайтесь с поддержкой"
    }
    </script>

    <!-- Per-page FAQPage schema is injected by Home.js via react-helmet-async to avoid duplicate-schema warnings. -->
    <!-- Landing pages (delivery-turkey-russia, customs-clearance, etc.) inject their own FAQPage. -->
    <!-- Site-wide schemas above (Organization / WebSite / LocalBusiness / SoftwareApplication) remain here. -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      input::placeholder {
        color: #9CA3AF;
      }
      input:focus {
        border-color: #3D8B8B !important;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
